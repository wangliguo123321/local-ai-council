[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-council"
version = "0.2.0"
description = "Local-first multi-AI council for independent answers, calibration, synthesis, and audit trails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Local AI Council contributors" }]
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "httpx>=0.27",
]
keywords = ["ai", "agents", "council", "multi-agent", "local-first", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

[project.scripts]
ai-council = "ai_council:main"

[tool.setuptools]
py-modules = ["ai_council", "agent_adapter", "web_app"]

[tool.setuptools.package-data]
"*" = ["web_static/*.html"]
